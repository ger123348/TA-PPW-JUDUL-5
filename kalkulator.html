<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kalkulator Ger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d; 
    color: #fff;
    padding: 16px;
  }

  .calculator {
    background: #111; 
    border-radius: 18px;
    padding: 18px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 18px 35px rgba(255, 140, 0, 0.25); 
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid #ff8b00; 
  }

  .calc-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .calc-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #ff8b00; 
  }

  .history-title {
    font-size: 0.75rem;
    opacity: 0.75;
    color: #ffae42; 
  }

  .history {
    background: #000; 
    border-radius: 10px;
    padding: 8px 10px;
    max-height: 80px;
    overflow-y: auto;
    font-size: 0.75rem;
    border: 1px solid #2b2b2b;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
    color: #ffebc4; 
  }

  .display {
    background: #000;
    border-radius: 12px;
    padding: 8px 12px;
    text-align: right;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    border: 1px solid #333;
  }

  .display-expression {
    font-size: 0.75rem;
    opacity: 0.6;
    color: #ffb75e;
  }

  .display-value {
    font-size: 1.8rem;
    font-weight: 600;
    color: #ff8b00; 
  }

  .memory-indicator {
    font-size: 0.75rem;
    opacity: 0.7;
    color: #ffd7a1;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 4px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.1s ease;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #262626;
  }

  button:hover {
    background: #272727;
  }

  button:active {
    transform: scale(0.97);
  }

  button.operator {
    background: #ff8b00; 
    color: #000;
    font-weight: bold;
    border: none;
  }

  button.operator:hover {
    background: #ffa231;
  }

  button.equal {
    background: #ffa500; 
    color: #000;
    font-weight: 700;
  }

  button.equal:hover {
    background: #ffb84d;
  }

  button.function {
    background: #333;
    font-size: 0.9rem;
    border: 1px solid #444;
  }

  button.memory {
    font-size: 0.8rem;
    background: #262626;
    border: 1px solid #444;
  }

  button.wide {
    grid-column: span 2;
  }

  button:focus-visible {
    outline: 2px solid #ffa500;
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .calculator {
      max-width: 100%;
    }

    .display-value {
      font-size: 1.6rem;
    }

    button {
      padding: 12px 8px;
    }
  }
</style>
</head>
<body>
  <div class="calculator">
    <div class="calc-header">
      <div>
        <div class="calc-title">Kalkulator</div>
        <div class="memory-indicator" id="memory-indicator">Memory: kosong</div>
      </div>
      <div class="history-title">History (maks 5)</div>
    </div>

    <div class="history" id="history"></div>

    <div class="display">
      <div class="display-expression" id="expression-display"></div>
      <div class="display-value" id="main-display">0</div>
    </div>

    <div class="buttons">

      <button class="memory function" data-action="memory" data-value="MC">MC</button>
      <button class="memory function" data-action="memory" data-value="MR">MR</button>
      <button class="memory function" data-action="memory" data-value="M+">M+</button>
      <button class="memory function" data-action="memory" data-value="M-">M-</button>

      <button class="function" data-action="clear-all">C</button>
      <button class="function" data-action="clear-entry">CE</button>
      <button class="function" data-action="backspace">⌫</button>
      <button class="operator" data-action="operator" data-value="÷">÷</button>

      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="×">×</button>

      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="-">-</button>

      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button class="wide" data-action="digit" data-value="0">0</button>
      <button data-action="decimal" data-value=".">.</button>
      <button class="equal" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const mainDisplay = document.getElementById("main-display");
    const expressionDisplay = document.getElementById("expression-display");
    const historyContainer = document.getElementById("history");
    const memoryIndicator = document.getElementById("memory-indicator");

    let currentInput = "0";
    let expression = "";         
    let lastPressed = null;     
    let history = [];            
    let memoryValue = 0;

    function updateDisplay() {
      mainDisplay.textContent = currentInput;
      expressionDisplay.textContent = expression.replace(/\*/g, "×").replace(/\//g, "÷");
      memoryIndicator.textContent =
        memoryValue !== 0 ? `Memory: ${memoryValue}` : "Memory: kosong";

      historyContainer.innerHTML = "";
      history.slice(-5).forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        const left = document.createElement("span");
        left.textContent = item.exp;
        const right = document.createElement("span");
        right.textContent = `= ${item.result}`;
        div.appendChild(left);
        div.appendChild(right);
        historyContainer.prepend(div);
      });
    }

    function handleDigit(digit) {
      if (lastPressed === "equals") {
        expression = "";
        currentInput = digit;
      } else if (currentInput === "0" || lastPressed === "operator") {
        currentInput = digit;
      } else {
        currentInput += digit;
      }
      lastPressed = "digit";
      updateDisplay();
    }

    function handleDecimal() {
      if (lastPressed === "operator" || lastPressed === "equals") {
        currentInput = "0.";
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }
      lastPressed = "digit";
      updateDisplay();
    }

    function safeExpressionString() {
      let exp = expression;
      if (lastPressed !== "operator" && lastPressed !== "equals") {
        exp += currentInput;
      }
      exp = exp.replace(/×/g, "*").replace(/÷/g, "/");
      return exp;
    }

    function handleOperator(op) {
      let opInternal = op;
      if (op === "×") opInternal = "*";
      if (op === "÷") opInternal = "/";

      if (lastPressed === "operator") {
        expression = expression.slice(0, -1) + opInternal;
      } else {
        if (expression === "" && lastPressed === "equals") {
          expression = currentInput + opInternal;
        } else {
          expression += currentInput + opInternal;
        }
      }
      lastPressed = "operator";
      updateDisplay();
    }

    function handleEquals() {
      try {
        const expRaw = safeExpressionString();
        if (!expRaw) return;

        const result = Function('"use strict"; return (' + expRaw + ')')();

        if (!isFinite(result)) {
          currentInput = "Error";
        } else if (isNaN(result)) {
          currentInput = "Error";
        } else {
          const finalResult = Number(result.toFixed(10)) * 1; 
          const expForDisplay = expRaw
            .replace(/\*/g, "×")
            .replace(/\//g, "÷");
          history.push({
            exp: expForDisplay,
            result: finalResult
          });
          currentInput = String(finalResult);
        }

        expression = "";
        lastPressed = "equals";
        updateDisplay();
      } catch (e) {
        currentInput = "Error";
        expression = "";
        lastPressed = "equals";
        updateDisplay();
      }
    }

    function handleClearAll() {
      currentInput = "0";
      expression = "";
      lastPressed = null;
      updateDisplay();
    }

    function handleClearEntry() {
      currentInput = "0";
      lastPressed = "digit";
      updateDisplay();
    }

    function handleBackspace() {
      if (lastPressed === "equals") return;
      if (currentInput.length <= 1) {
        currentInput = "0";
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function handleMemory(action) {
      const value = parseFloat(currentInput);
      switch (action) {
        case "MC":
          memoryValue = 0;
          break;
        case "MR":
          currentInput = String(memoryValue || 0);
          lastPressed = "digit";
          break;
        case "M+":
          if (!isNaN(value)) memoryValue += value;
          break;
        case "M-":
          if (!isNaN(value)) memoryValue -= value;
          break;
      }
      updateDisplay();
    }

    document.querySelector(".buttons").addEventListener("click", (e) => {
      if (!(e.target instanceof HTMLButtonElement)) return;

      const action = e.target.getAttribute("data-action");
      const value = e.target.getAttribute("data-value");

      switch (action) {
        case "digit":
          handleDigit(value);
          break;
        case "decimal":
          handleDecimal();
          break;
        case "operator":
          handleOperator(value);
          break;
        case "equals":
          handleEquals();
          break;
        case "clear-all":
          handleClearAll();
          break;
        case "clear-entry":
          handleClearEntry();
          break;
        case "backspace":
          handleBackspace();
          break;
        case "memory":
          handleMemory(value);
          break;
      }
    });

    document.addEventListener("keydown", (e) => {
      const key = e.key;

      if (key >= "0" && key <= "9") {
        e.preventDefault();
        handleDigit(key);
      } else if (key === ".") {
        e.preventDefault();
        handleDecimal();
      } else if (key === "+" || key === "-" || key === "*" || key === "/") {
        e.preventDefault();
        const mapOp = key === "*" ? "×" : key === "/" ? "÷" : key;
        handleOperator(mapOp);
      } else if (key === "Enter" || key === "=") {
        e.preventDefault();
        handleEquals();
      } else if (key === "Escape") {
        e.preventDefault();
        handleClearAll();
      } else if (key === "Backspace") {
        e.preventDefault();
        handleBackspace();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
